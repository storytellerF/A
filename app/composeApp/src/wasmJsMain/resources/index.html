<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script>
        if (location.search.includes('appium=true')) {
            window.appiumErrors = [];
            const describeError = error => error?.stack || String(error);
            addEventListener('error', event => window.appiumErrors.push(describeError(event.error || event.message)));
            addEventListener('unhandledrejection', event => window.appiumErrors.push(describeError(event.reason)));
        }
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
</body>
</html>
