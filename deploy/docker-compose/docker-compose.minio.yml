volumes:
  minio-data:

services:
  minio:
    image: a-minio:${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    build:
      context: ../..
      dockerfile: minio.Dockerfile
      args:
        MINIO_VERSION: ${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    ports:
      - ${MINIO_PORT}:9000
      - ${MINIO_CONSOLE_PORT}:9001
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_NAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "curl -I http://localhost:9000/minio/health/live" ]
