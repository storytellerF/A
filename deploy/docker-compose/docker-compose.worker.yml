services:
  worker:
    build:
      context: ../../
      target: worker
      args:
        BUILD_ON: ${BUILD_ON}
    restart: unless-stopped
    environment:
      LOG_PATH: /home/app/logs/worker
    env_file:
      - ../../deploy/${FLAVOR}.env
    volumes:
      - service-logs:/home/app/logs
      - worker-home:/home/app

volumes:
  worker-home:
