services:
  server:
    build:
      context: ../../
      target: server
      args:
        BUILD_ON: ${BUILD_ON}
    restart: unless-stopped
    env_file:
      - ../../deploy/${FLAVOR}.env
    ports:
      - ${SERVER_EXPOSE_PORT}:80
    volumes:
      - ${PRESET_PATH}:/app/deploy/preset_data
  ws:
    build:
      context: ../../
      target: ws
      args:
        BUILD_ON: ${BUILD_ON}
    restart: unless-stopped
    env_file:
      - ../../deploy/${FLAVOR}.env
    ports:
      - ${WS_SERVER_EXPOSE_PORT:-8813}:80
