services:
  server:
    build:
      context: ../../
      target: server
      args:
        BUILD_ON: ${BUILD_ON}
    restart: unless-stopped
    environment:
      LOG_PATH: /home/app/logs/server
      SERVER_PORT: 80
    env_file:
      - ${APP_ENV_FILE:-../../deploy/${FLAVOR}.env}
    ports:
      - ${SERVER_EXPOSE_PORT}:80
    volumes:
      - service-logs:/home/app/logs
      - ${PRESET_PATH}:/app/deploy/preset_data
  ws:
    build:
      context: ../../
      target: ws
      args:
        BUILD_ON: ${BUILD_ON}
    restart: unless-stopped
    environment:
      LOG_PATH: /home/app/logs/ws
      WS_SERVER_PORT: 80
    env_file:
      - ${APP_ENV_FILE:-../../deploy/${FLAVOR}.env}
    ports:
      - ${WS_SERVER_EXPOSE_PORT:-8813}:80
    volumes:
      - service-logs:/home/app/logs
