services:
  filesystem:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: filesystem-service
      args:
        BUILD_ON: ${BUILD_ON}
    restart: unless-stopped
    environment:
      FILESYSTEM_RPC_PORT: 8820
      FILE_SYSTEM_MEDIA_PATH: /data
      FILESYSTEM_HTTP_PORT: 8822
      FILESYSTEM_PUBLIC_URL: ${FILESYSTEM_PUBLIC_URL:?set the externally reachable filesystem HTTP origin}
    expose:
      - "8820"
    ports:
      - ${FILESYSTEM_EXPOSE_PORT:-8822}:8822
    volumes:
      - ../a_file_data:/data
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8820/health" ]
      interval: 10s
      timeout: 5s
      retries: 12

  cli:
    environment:
      MEDIA_SERVICE: filesystem
      FILESYSTEM_RPC_URL: ws://filesystem:8820/rpc
  server:
    environment:
      MEDIA_SERVICE: filesystem
      FILESYSTEM_RPC_URL: ws://filesystem:8820/rpc
  worker:
    environment:
      MEDIA_SERVICE: filesystem
      FILESYSTEM_RPC_URL: ws://filesystem:8820/rpc
  ws:
    environment:
      MEDIA_SERVICE: filesystem
      FILESYSTEM_RPC_URL: ws://filesystem:8820/rpc
