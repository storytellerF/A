services:
  app-wasm:
    build:
      context: ../../
      dockerfile: wasm.Dockerfile
      target: app-wasm
      args:
        FLAVOR: ${FLAVOR}
        BUILD_TYPE: ${BUILD_TYPE}
        SERVER_URL: ${SERVER_URL}
        WS_SERVER_URL: ${WS_SERVER_URL}
    restart: unless-stopped
    ports:
      - ${APP_WASM_PORT:-8080}:80
    depends_on:
      server:
        condition: service_started
      ws:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  panel-wasm:
    build:
      context: ../../
      dockerfile: wasm.Dockerfile
      target: panel-wasm
      args:
        FLAVOR: ${FLAVOR}
        BUILD_TYPE: ${BUILD_TYPE}
        SERVER_URL: ${SERVER_URL}
        WS_SERVER_URL: ${WS_SERVER_URL}
    restart: unless-stopped
    ports:
      - ${PANEL_WASM_PORT:-8081}:80
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
