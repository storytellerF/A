services:
  app-wasm:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - ${APP_WASM_PORT:-8080}:80
    volumes:
      - ../../app/webApp/build/dist/wasmJs/productionExecutable:/usr/share/nginx/html:ro
      - ./app-wasm.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_started
      ws:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  panel-wasm:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - ${PANEL_WASM_PORT:-8081}:80
    volumes:
      - ../../panel/webApp/build/dist/wasmJs/productionExecutable:/usr/share/nginx/html:ro
      - ./app-wasm.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
