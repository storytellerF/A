server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: a-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: server
          __path__: /var/log/A/server/*.log
      - targets:
          - localhost
        labels:
          job: worker
          __path__: /var/log/A/worker/*.log
      - targets:
          - localhost
        labels:
          job: ws
          __path__: /var/log/A/ws/*.log
      - targets:
          - localhost
        labels:
          job: cli
          __path__: /var/log/A/cli/*.log
      - targets:
          - localhost
        labels:
          job: filesystem
          __path__: /var/log/A/filesystem/*.log
      - targets:
          - localhost
        labels:
          job: lucene
          __path__: /var/log/A/lucene/*.log
