name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/release.yml'
      - 'app/**'
      - 'shared/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'client/**'
      - 'api/**'
      - 'panel/**'
      - 'backend/**'
      - 'cloud/**'
      - 'bgscripts/**'
      - '*.kts'
      - 'Dockerfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: alpha
    env:
      # this will take the entire vars context configured in the repository > environments
      # setting and convert it to JSON so we can automatically assign all the values to the
      # runner's environment
      VARS_CONTEXT: ${{ toJson(vars) }}
      SECRETS_CONTEXT: ${{ toJson(secrets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          lfs: true
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build alpha app
        run: |
          ./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target android
          ./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target android-panel

      - uses: actions/upload-artifact@v7
        with:
          name: Signed Alpha Heart android Bundle
          path: |
            build/outputs/apk/release/
            build/outputs/pkg/release/

  build-desktop-deb:
    needs: build-android
    runs-on: ubuntu-latest
    env:
      # this will take the entire vars context configured in the repository > environments
      # setting and convert it to JSON so we can automatically assign all the values to the
      # runner's environment
      VARS_CONTEXT: ${{ toJson(vars) }}
      SECRETS_CONTEXT: ${{ toJson(secrets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          lfs: true
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build alpha deb
        run: |
          ./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target desktop-deb
          ./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target desktop-deb-panel

      - uses: actions/upload-artifact@v7
        with:
          name: Signed Alpha Heart deb Bundle
          path: |
            build/outputs/apk/release/
            build/outputs/pkg/release/

  build-desktop-msi:
    if: false
    runs-on: windows-latest
    env:
      # this will take the entire vars context configured in the repository > environments
      # setting and convert it to JSON so we can automatically assign all the values to the
      # runner's environment
      VARS_CONTEXT: ${{ toJson(vars) }}
      SECRETS_CONTEXT: ${{ toJson(secrets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          lfs: true
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # setup-gradle v6.2 cleanup removes Windows cache paths before saving.
          # Restore on-success after https://github.com/gradle/actions/issues/1013 is fixed.
          cache-cleanup: never

      - name: Build alpha msi
        run: |
          & "C:\\Program Files\\Git\\bin\\bash.exe" -c "./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target desktop-msi"
          & "C:\\Program Files\\Git\\bin\\bash.exe" -c "./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target desktop-msi-panel"

      - uses: actions/upload-artifact@v7
        with:
          name: Signed Alpha Heart msi Bundle
          path: |
            build/outputs/pkg/release/

  build-desktop-dmg:
    runs-on: macos-latest
    if: false
    env:
      # this will take the entire vars context configured in the repository > environments
      # setting and convert it to JSON so we can automatically assign all the values to the
      # runner's environment
      VARS_CONTEXT: ${{ toJson(vars) }}
      SECRETS_CONTEXT: ${{ toJson(secrets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          lfs: true
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build alpha dmg
        run: |
          ./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target desktop-dmg
          ./scripts/build_scripts/build-app-on-ci.sh --flavor alpha --url api.acommunity.top --target desktop-dmg-panel

      - uses: actions/upload-artifact@v7
        with:
          name: Signed Alpha Heart dmg Bundle
          path: |
            build/outputs/pkg/release/

  release-server:
    # Temporarily paused. Restore the branch condition when server deployment resumes.
    if: false
    needs: build-desktop-deb
    runs-on: ubuntu-latest
    environment: alpha
    env:
      # this will take the entire vars context configured in the repository > environments
      # setting and convert it to JSON so we can automatically assign all the values to the
      # runner's environment
      VARS_CONTEXT: ${{ toJson(vars) }}
      SECRETS_CONTEXT: ${{ toJson(secrets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          lfs: true

      - name: Start service
        run: ./scripts/service_scripts/start-service-on-ci.sh alpha

  release:
    name: Upload release assets
    needs: [build-android, build-desktop-deb]
    if: (github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: Signed Alpha Heart * Bundle
          merge-multiple: true

      - name: Upload release assets
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
