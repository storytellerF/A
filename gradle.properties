#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8G

#Gradle
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.experimental.enableScreenshotTest=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# If set to true, enables Gradle Worker API for Detekt tasks. `false` by default.
# See the doc for the Worker API at https://docs.gradle.org/8.1/userguide/worker_api.html
# Process-isolated workers lack heap configuration in Detekt 2.0.0-alpha.6.
detekt.use.worker.api = false

target.ios=false

app.debug=false
server.buildType=dev
server.flavor=dev
